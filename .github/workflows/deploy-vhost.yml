name: 部署到虚拟主机（FTP）

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查部署配置
        shell: bash
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          [[ -n "$FTP_HOST" ]] || { echo "Missing repository variable: FTP_HOST"; exit 1; }
          [[ -n "$FTP_USER" ]] || { echo "Missing repository variable: FTP_USER"; exit 1; }
          [[ -n "$FTP_PASS" ]] || { echo "Missing repository secret: FTP_PASS"; exit 1; }

      - name: 预解析 FTP 域名（规避 GitHub Actions DNS 解析失败）
        shell: bash
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
        run: |
          # 用 Python + Google DNS 解析，避免依赖 dig/nslookup
          IP=$(python3 -c "
          import socket, struct, urllib.request, json
          host = '${FTP_HOST}'
          # 方法1: 系统解析
          try:
              ip = socket.gethostbyname(host)
              print(ip); exit()
          except: pass
          # 方法2: Google DoH
          try:
              url = f'https://dns.google/resolve?name={host}&type=A'
              data = json.loads(urllib.request.urlopen(url, timeout=10).read())
              for ans in data.get('Answer', []):
                  if ans.get('type') == 1:
                      print(ans['data']); exit()
          except: pass
          " 2>/dev/null)
          if [[ -n "$IP" ]]; then
            echo "Resolved $FTP_HOST -> $IP"
            echo "$IP $FTP_HOST" | sudo tee -a /etc/hosts
          else
            echo "WARNING: Could not resolve $FTP_HOST, proceeding without hosts entry"
          fi

      - name: 部署到 FTP（带重试）
        shell: bash
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== FTP deploy attempt $i/$MAX_RETRIES ==="
            if lftp -c "
              set net:timeout 30
              set net:max-retries 3
              set ftp:ssl-allow no
              open ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}
              mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob node_modules/ --exclude-glob supabase/ --exclude-glob scripts/ --exclude-glob docs/ --exclude-glob '*.ts' --exclude-glob '*.map' --exclude-glob tsconfig.json --exclude-glob 'package*.json' ./ /wwwroot/
              bye
            "; then
              echo "=== FTP deploy succeeded on attempt $i ==="
              exit 0
            fi
            echo "=== Attempt $i failed, waiting 10s before retry ==="
            sleep 10
          done
          echo "=== FTP deploy failed after $MAX_RETRIES attempts ==="
          exit 1
