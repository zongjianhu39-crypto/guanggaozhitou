<body class="audience-repository-page">

    <main class="audience-shell">
        <section class="audience-hero">
            <div>
                <h1>人群仓库</h1>
                <p>沉淀达摩盘人群包、圈选逻辑、人群定义和图片维度占比，后续可直接被投放分析、GenBI 和策略复盘调用。</p>
            </div>
            <div id="audience-stats" class="audience-stats" aria-live="polite"></div>
        </section>

        <div class="audience-grid">
            <div>
                <section class="audience-panel">
                    <h2>导入数据</h2>
                    <p>主表负责基础字段，图片提取表负责把图片中的占比转成结构化维度。</p>
                    <div class="audience-upload-stack">
                        <label class="audience-file-label">
                            人群仓库主表
                            <input id="audience-main-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
                            <small>例如：人群仓库.xlsx</small>
                        </label>
                        <label class="audience-file-label">
                            图片数据提取表
                            <input id="audience-extract-file" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
                            <small>例如：人群仓库_图片数据提取.xlsx；未上传时只导入基础字段、图片公式 ID 和图片文件映射。</small>
                        </label>
                    </div>
                    <div class="audience-actions">
                        <button id="parse-audience-btn" type="button" class="audience-button">解析预览</button>
                        <button id="save-audience-btn" type="button" class="audience-button audience-button-primary">写入 Supabase</button>
                    </div>
                    <div id="audience-status" class="audience-status" aria-live="polite"></div>
                </section>

                <section class="audience-panel">
                    <h2>解析预览</h2>
                    <div id="audience-preview"></div>
                </section>
            </div>

            <section class="audience-panel">
                <div class="audience-list-toolbar">
                    <label class="audience-search">
                        <input id="audience-search" type="search" placeholder="搜索人群名称、圈选逻辑或定义">
                    </label>
                    <button id="refresh-audience-btn" type="button" class="audience-button">刷新</button>
                </div>
                <div id="audience-list" class="audience-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script src="assets/js/config.js"></script>
    <script src="script.js?v=202605030900"></script>
    <script src="assets/js/audience-repository-api.js?v=202605030900" defer></script>
    <script src="assets/js/audience-repository-page.js?v=202605030900" defer></script>
</body>
</html>
