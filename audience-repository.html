                <li><a href="audience-repository.html" class="nav-link active">人群仓库</a></li>

        </div>

    <main class="audience-shell">
        <section class="audience-hero">
            <div>
                <h1>人群仓库</h1>
                <p>录入达摩盘人群包信息，上传各维度截图，由 AI 解析成结构化占比数据，后续可直接被投放分析、GenBI 和策略复盘调用。</p>
            </div>
            <div id="audience-stats" class="audience-stats" aria-live="polite"></div>
        </section>

        <div class="audience-grid">
            <div>
                <section class="audience-panel">
                    <h2 id="audience-form-title">新增人群</h2>
                    <p>直接填写人群基础信息，并上传各维度截图，系统会解析成“人群仓库ID / 维度 / 分类 / 分析人群占比”的格式。</p>
                    <div class="audience-form-grid">
                        <label class="audience-field">
                            达摩盘人群包 ID
                            <input id="audience-id" type="number" inputmode="numeric" placeholder="例如 51532258">
                        </label>
                        <label class="audience-field">
                            人群规模
                            <input id="audience-size" type="number" inputmode="numeric" placeholder="例如 451015">
                        </label>
                        <label class="audience-field audience-field-wide">
                            达摩盘人群名称
                            <input id="audience-name" type="text" placeholder="例如 交个朋友活跃成交复购人群_电商部">
                        </label>
                        <label class="audience-field">
                            有效期开始
                            <input id="audience-valid-from" type="date">
                        </label>
                        <label class="audience-field">
                            有效期结束
                            <input id="audience-valid-to" type="date">
                        </label>
                        <label class="audience-field audience-field-wide">
                            圈选逻辑
                            <textarea id="audience-selection-logic" rows="3" placeholder="例如 数据银行（直播通用人群筛选...）"></textarea>
                        </label>
                        <label class="audience-field audience-field-wide">
                            人群定义
                            <textarea id="audience-definition" rows="4" placeholder="填写这类人群的定义、成交/访问/复购等条件"></textarea>
                        </label>
                    </div>
                    <div id="audience-image-grid" class="audience-image-grid"></div>
                    <div class="audience-actions">
                        <button id="parse-audience-btn" type="button" class="audience-button">AI 解析图片</button>
                        <button id="save-audience-btn" type="button" class="audience-button audience-button-primary">写入 Supabase</button>
                        <button id="reset-audience-btn" type="button" class="audience-button">新建 / 清空</button>
                    </div>
                    <div id="audience-status" class="audience-status" aria-live="polite"></div>
                </section>

                <section class="audience-panel">
                    <h2>解析预览</h2>
                    <div id="audience-preview"></div>
                </section>
            </div>

            <section class="audience-panel">
                <div class="audience-list-toolbar">
                    <label class="audience-search">
                        <input id="audience-search" type="search" placeholder="搜索人群名称、圈选逻辑或定义">
                    </label>
                    <button id="refresh-audience-btn" type="button" class="audience-button">刷新</button>
                </div>
                <div id="audience-list" class="audience-list" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="script.js?v=202605030900"></script>
    <script src="assets/js/audience-repository-api.js?v=202605030900" defer></script>
    <script src="assets/js/audience-repository-page.js?v=202605031030" defer></script>
</body>
</html>
